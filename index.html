  <body>
    <div id="root"></div>
    <!-- SPA GitHub Pages redirect: restores the original path encoded by 404.html.
         Must run before the app script so React Router sees the correct URL.
         Technique: https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
