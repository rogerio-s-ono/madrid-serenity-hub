<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- STEALTH / PRE-LAUNCH: block all search engine indexing while the site is
         being tested. Remove this line (and update robots.txt) at public launch,
         once legal pages and real testimonials are in place. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts: preconnect for faster handshake, then load the stylesheet.
         'display=swap' is in the URL so text renders immediately with a fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" />

    <title>Therapy for your Heart &amp; Soul | Tania Ono</title>
    <meta name="description" content="Emotional clarity. Inner strength. Lasting transformation. Professional psychotherapy in the heart of Madrid.">
    <meta name="author" content="Tania Eustaquio Ono">

    <!-- Social share metadata.
         NOTE: og:image / twitter:image are intentionally omitted until launch —
         a branded preview image should be added when the site goes public. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Therapy for your Heart &amp; Soul | Tania Ono">
    <meta property="og:description" content="Emotional clarity. Inner strength. Lasting transformation. Professional psychotherapy in the heart of Madrid.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Therapy for your Heart &amp; Soul | Tania Ono">
    <meta name="twitter:description" content="Emotional clarity. Inner strength. Lasting transformation. Professional psychotherapy in the heart of Madrid.">
  </head>

  <body>
    <div id="root"></div>
    <!-- SPA GitHub Pages redirect: restores the original path encoded by 404.html.
         Must run before the app script so React Router sees the correct URL.
         Technique: https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
