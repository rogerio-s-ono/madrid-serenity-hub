<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages (static host has no server-side rewrites).
      // Encodes the requested path into a query string and redirects to index.html,
      // where a matching snippet restores the original URL for the client router.
      // Technique: https://github.com/rafgraph/spa-github-pages
      (function () {
        // Number of path segments that make up the project base (e.g. /madrid-serenity-hub/ = 1).
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
